<script>
  let board = Array(9).fill(null);
  let currentPlayer = 'X';
  let isGameOver = false;
  let scores = { X: 0, O: 0, tie: 0 };
  let roundNumber = 1;

  const TURN_DURATION = 15; // 15 seconds per turn
  let timeLeft = TURN_DURATION;
  let timerInterval = null;

  const WIN_COMBOS = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
  function playBeep(freq = 440, type = 'sine', duration = 0.08) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function startTurnTimer() {
    stopTurnTimer();
    if (isGameOver) return;

    timeLeft = TURN_DURATION;
    updateTimerVisuals();

    timerInterval = setInterval(() => {
      timeLeft = Math.max(0, timeLeft - 0.1);
      updateTimerVisuals();

      // Warning beep on final 3 seconds (each full second)
      if (timeLeft <= 3.05 && timeLeft > 0.05 && Math.abs(timeLeft - Math.round(timeLeft)) < 0.06) {
        playBeep(880, 'sine', 0.05);
      }

      if (timeLeft <= 0) {
        stopTurnTimer();
        // Time expired: alert sound and pass turn
        playBeep(260, 'sawtooth', 0.25);
        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        render();
      }
    }, 100);
  }

  function stopTurnTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  function updateTimerVisuals() {
    const timerText = document.getElementById('timer-text');
    const gauge = document.getElementById('turn-gauge');
    const roundText = document.getElementById('round-text');

    if (roundText) roundText.textContent = "Round " + roundNumber;

    if (timerText) {
      const secs = Math.ceil(timeLeft);
      timerText.textContent = secs + "s";
      if (timeLeft <= 3) {
        timerText.className = "font-label-sm text-label-sm uppercase tracking-wider text-[#ffb4ab] font-bold animate-pulse";
      } else {
        timerText.className = "font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant font-medium";
      }
    }

    if (gauge) {
      const pct = (timeLeft / TURN_DURATION) * 100;
      gauge.style.width = pct + "%";
      if (isGameOver) {
        gauge.style.width = "0%";
      } else if (currentPlayer === 'X') {
        gauge.className = "h-full bg-primary-container rounded-full shadow-[0_0_12px_rgba(0,242,254,0.7)] transition-[width] duration-100 ease-linear";
      } else {
        gauge.className = "h-full bg-secondary-container rounded-full shadow-[0_0_12px_rgba(225,3,125,0.7)] transition-[width] duration-100 ease-linear";
      }
    }
  }

  function checkWinner() {
    for (const combo of WIN_COMBOS) {
      const [a, b, c] = combo;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        return { winner: board[a], combo };
      }
    }
    if (board.every(cell => cell !== null)) {
      return { winner: 'TIE', combo: null };
    }
    return null;
  }

  function updateActiveVisuals(winnerInfo) {
    const cardX = document.getElementById('card-player-x');
    const cardO = document.getElementById('card-player-o');
    const glowX = document.getElementById('glow-player-x');
    const glowO = document.getElementById('glow-player-o');
    const badgeX = document.getElementById('badge-player-x');
    const badgeO = document.getElementById('badge-player-o');
    const iconX = document.getElementById('icon-box-x');
    const iconO = document.getElementById('icon-box-o');
    const turnPing = document.getElementById('turn-ping');
    const turnDot = document.getElementById('turn-dot');
    const turnText = document.getElementById('turn-text');

    if (!cardX || !cardO) return;

    if (winnerInfo) {
      stopTurnTimer();
      if (winnerInfo.winner === 'X') {
        cardX.className = "col-span-3 p-space-sm rounded-xl flex flex-col items-center gap-1 relative overflow-hidden transition-all duration-300 bg-surface-container-high ring-2 ring-[#00f2fe] shadow-[0_0_32px_rgba(0,242,254,0.7)] scale-[1.05]";
        cardO.className = "col-span-3 p-space-sm rounded-xl flex flex-col items-center gap-1 relative overflow-hidden transition-all duration-300 bg-surface-container-low opacity-30 scale-95 ring-0 shadow-none";
        badgeX.textContent = "WINNER! 🏆";
        badgeX.className = "bg-primary-container text-on-primary-container font-label-sm text-label-sm px-2 py-0.5 rounded-full uppercase text-[9px] tracking-widest font-black shadow-[0_0_12px_rgba(0,242,254,0.6)]";
        badgeO.textContent = "DEFEATED";
        badgeO.className = "bg-surface-container text-outline font-label-sm text-label-sm px-1.5 py-0.5 rounded-full uppercase text-[9px] tracking-widest";
      } else if (winnerInfo.winner === 'O') {
        cardO.className = "col-span-3 p-space-sm rounded-xl flex flex-col items-center gap-1 relative overflow-hidden transition-all duration-300 bg-surface-container-high ring-2 ring-[#e1037d] shadow-[0_0_32px_rgba(225,3,125,0.7)] scale-[1.05]";
        cardX.className = "col-span-3 p-space-sm rounded-xl flex flex-col items-center gap-1 relative overflow-hidden transition-all duration-300 bg-surface-container-low opacity-30 scale-95 ring-0 shadow-none";
        badgeO.textContent = "WINNER! 🏆";
        badgeO.className = "bg-secondary-container text-on-secondary-container font-label-sm text-label-sm px-2 py-0.5 rounded-full uppercase text-[9px] tracking-widest font-black shadow-[0_0_12px_rgba(225,3,125,0.6)]";
        badgeX.textContent = "DEFEATED";
        badgeX.className = "bg-surface-container text-outline font-label-sm text-label-sm px-1.5 py-0.5 rounded-full uppercase text-[9px] tracking-widest";
      } else {
        cardX.className = "col-span-3 p-space-sm rounded-xl flex flex-col items-center gap-1 relative overflow-hidden transition-all duration-300 bg-surface-container-high opacity-75 scale-100 ring-1 ring-outline-variant";
        cardO.className = "col-span-3 p-space-sm rounded-xl flex flex-col items-center gap-1 relative overflow-hidden transition-all duration-300 bg-surface-container-high opacity-75 scale-100 ring-1 ring-outline-variant";
        badgeX.textContent = "DRAW";
        badgeO.textContent = "DRAW";
      }
      updateTimerVisuals();
      return;
    }

    if (currentPlayer === 'X') {
      // Highlight X
      cardX.className = "col-span-3 p-space-sm rounded-xl flex flex-col items-center gap-1 relative overflow-hidden transition-all duration-300 bg-surface-container-high ring-2 ring-[#00f2fe] shadow-[0_0_24px_rgba(0,242,254,0.45)] scale-[1.03]";
      if (glowX) glowX.style.opacity = "1";
      badgeX.textContent = "YOUR TURN";
      badgeX.className = "bg-primary/20 text-primary-fixed border border-primary/40 font-label-sm text-label-sm px-1.5 py-0.5 rounded-full uppercase text-[9px] tracking-widest font-bold shadow-[0_0_8px_rgba(0,242,254,0.4)]";
      iconX.className = "w-6 h-6 rounded-lg bg-surface-container-lowest flex items-center justify-center text-primary-container shadow-[0_0_12px_rgba(0,242,254,0.6)] transition-all";

      // Dim O
      cardO.className = "col-span-3 p-space-sm rounded-xl flex flex-col items-center gap-1 relative overflow-hidden transition-all duration-300 bg-surface-container-low opacity-40 scale-95 ring-0 shadow-none";
      if (glowO) glowO.style.opacity = "0";
      badgeO.textContent = "WAITING";
      badgeO.className = "bg-surface-container text-outline font-label-sm text-label-sm px-1.5 py-0.5 rounded-full uppercase text-[9px] tracking-widest";
      iconO.className = "w-6 h-6 rounded-lg bg-surface-container-lowest flex items-center justify-center text-secondary-container shadow-none transition-all";

      // Top pill
      if (turnPing) turnPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-container opacity-75";
      if (turnDot) turnDot.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-primary-container";
      if (turnText) {
        turnText.textContent = "Player X's Turn";
        turnText.className = "font-label-md text-label-md uppercase text-primary tracking-wider font-semibold transition-colors duration-300";
      }
    } else {
      // Highlight O
      cardO.className = "col-span-3 p-space-sm rounded-xl flex flex-col items-center gap-1 relative overflow-hidden transition-all duration-300 bg-surface-container-high ring-2 ring-[#e1037d] shadow-[0_0_24px_rgba(225,3,125,0.45)] scale-[1.03]";
      if (glowO) glowO.style.opacity = "1";
      badgeO.textContent = "YOUR TURN";
      badgeO.className = "bg-secondary-container/20 text-secondary-container border border-secondary-container/40 font-label-sm text-label-sm px-1.5 py-0.5 rounded-full uppercase text-[9px] tracking-widest font-bold shadow-[0_0_8px_rgba(225,3,125,0.4)]";
      iconO.className = "w-6 h-6 rounded-lg bg-surface-container-lowest flex items-center justify-center text-secondary-container shadow-[0_0_12px_rgba(225,3,125,0.6)] transition-all";

      // Dim X
      cardX.className = "col-span-3 p-space-sm rounded-xl flex flex-col items-center gap-1 relative overflow-hidden transition-all duration-300 bg-surface-container-low opacity-40 scale-95 ring-0 shadow-none";
      if (glowX) glowX.style.opacity = "0";
      badgeX.textContent = "WAITING";
      badgeX.className = "bg-surface-container text-outline font-label-sm text-label-sm px-1.5 py-0.5 rounded-full uppercase text-[9px] tracking-widest";
      iconX.className = "w-6 h-6 rounded-lg bg-surface-container-lowest flex items-center justify-center text-primary-container shadow-none transition-all";

      // Top pill
      if (turnPing) turnPing.className = "animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary-container opacity-75";
      if (turnDot) turnDot.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-secondary-container";
      if (turnText) {
        turnText.textContent = "Player O's Turn";
        turnText.className = "font-label-md text-label-md uppercase text-secondary tracking-wider font-semibold transition-colors duration-300";
      }
    }
  }

  function render(winnerInfo = null) {
    const grid = document.getElementById('board-grid');
    if (!grid) return;
    grid.innerHTML = '';

    const winningCombo = winnerInfo && winnerInfo.combo ? winnerInfo.combo : [];

    board.forEach((val, idx) => {
      const btn = document.createElement('button');
      const isWinningCell = winningCombo.includes(idx);
      
      let baseClasses = "w-full h-full rounded-lg flex items-center justify-center transition-all duration-200 active:scale-95 shadow-[inset_0_1px_0_rgba(255,255,255,0.06)] relative overflow-hidden group cursor-pointer ";
      
      if (isWinningCell) {
        baseClasses += val === 'X' ? "bg-primary-container/20 ring-2 ring-primary-container shadow-[0_0_20px_rgba(0,242,254,0.6)] " : "bg-secondary-container/20 ring-2 ring-secondary-container shadow-[0_0_20px_rgba(225,3,125,0.6)] ";
      } else {
        baseClasses += "bg-surface-container-high hover:bg-surface-bright ";
      }

      btn.className = baseClasses;
      btn.setAttribute('aria-label', "Cell " + idx);

      if (val === 'X') {
        btn.innerHTML = '<span class="material-symbols-outlined text-[44px] text-primary-container drop-shadow-[0_0_12px_rgba(0,242,254,0.85)] font-black">close</span>';
      } else if (val === 'O') {
        btn.innerHTML = '<span class="material-symbols-outlined text-[40px] text-secondary-container drop-shadow-[0_0_12px_rgba(225,3,125,0.85)] font-black">radio_button_unchecked</span>';
      } else if (!isGameOver) {
        btn.innerHTML = '<span class="material-symbols-outlined text-[28px] text-outline/20 group-hover:text-primary-container/40 transition-colors">' + (currentPlayer === 'X' ? 'close' : 'radio_button_unchecked') + '</span>';
      }

      btn.addEventListener('click', () => handleMove(idx));
      grid.appendChild(btn);
    });

    const sx = document.getElementById('score-x');
    if (sx) sx.textContent = scores.X;
    const so = document.getElementById('score-o');
    if (so) so.textContent = scores.O;
    const st = document.getElementById('score-tie');
    if (st) st.textContent = scores.tie;

    updateActiveVisuals(winnerInfo);

    if (!isGameOver) {
      startTurnTimer();
    }
  }

  function handleMove(idx) {
    if (board[idx] || isGameOver) return;

    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    playBeep(currentPlayer === 'X' ? 650 : 440, 'triangle', 0.1);

    board[idx] = currentPlayer;
    const result = checkWinner();

    if (result) {
      isGameOver = true;
      stopTurnTimer();
      const turnText = document.getElementById('turn-text');
      if (result.winner === 'TIE') {
        scores.tie++;
        if (turnText) turnText.textContent = "Round Draw!";
        playBeep(300, 'sawtooth', 0.2);
      } else {
        scores[result.winner]++;
        if (turnText) turnText.textContent = "Player " + result.winner + " Won!";
        playBeep(880, 'sine', 0.15);
        setTimeout(() => playBeep(1100, 'sine', 0.25), 160);
      }
      render(result);
    } else {
      currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
      render();
    }
  }

  function resetRound() {
    board = Array(9).fill(null);
    currentPlayer = 'X';
    isGameOver = false;
    roundNumber++;
    playBeep(520, 'sine', 0.1);
    render();
  }

  const btnRestart = document.getElementById('btn-restart');
  if (btnRestart) {
    btnRestart.addEventListener('click', () => {
      scores = { X: 0, O: 0, tie: 0 };
      roundNumber = 1;
      resetRound();
    });
  }

  const btnNewRound = document.getElementById('btn-new-round');
  if (btnNewRound) {
    btnNewRound.addEventListener('click', resetRound);
  }

  render();
</script></main>

</body></html>
